name: Publish reviewed Firebase version (manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact finalized sites/SITE/versions/VERSION from the staging report'
        required: true
        type: string
      expected_current:
        description: 'Current live sites/SITE/versions/VERSION, or NONE for first release'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: d-apps-production-content
  cancel-in-progress: false
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check build resources
        run: |
          ps -eo pid,comm
          df -h .
          if command -v free >/dev/null; then free -h; else vm_stat; fi
      - run: npm run check && npm test && npm run verify:distribution && npm run build && npm run verify:site
      - run: npm run verify:release -- --fetch --macos
      - run: npm run verify:firebase
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISHER_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Verify staged bytes and expected live version, then publish
        env:
          FIREBASE_SITE_ID: ${{ vars.FIREBASE_SITE_ID }}
          RELEASE_ID: ${{ github.sha }}
          REVIEWED_VERSION: ${{ inputs.version }}
          EXPECTED_CURRENT: ${{ inputs.expected_current }}
        run: node scripts/firebase-publish.mjs release "$FIREBASE_SITE_ID" "$RELEASE_ID" "$REVIEWED_VERSION" "$EXPECTED_CURRENT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firebase-release-result
          path: .artifacts/hosting/release-result.json
          include-hidden-files: true
          retention-days: 7

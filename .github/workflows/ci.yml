name: Verify site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan committed history for secrets
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify immutable distribution history
        env:
          DISTRIBUTION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run verify:distribution
      - name: Check build resources
        run: |
          ps -eo pid,comm
          df -h .
          if command -v free >/dev/null; then free -h; else vm_stat; fi
      - run: npm run lint && npm run check && npm test && npm run build && npm run verify:site
      - run: npm audit --audit-level=moderate
      - run: npm run verify:release -- --fetch
      - run: npm run verify:firebase
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.17.2
      - name: Validate infrastructure without cloud credentials
        run: |
          terraform -chdir=infra/gcp fmt -check
          terraform -chdir=infra/gcp init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/gcp validate
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reviewed-site-and-infrastructure
          path: |
            dist/
            infra/generated/
          retention-days: 7
